<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FreeFSM protocol exerciser</title>
<main><h1>Interactive protocol exerciser</h1><p>Not a production client. Secrets stay in this page's memory and are discarded on reload. No automatic retries. <a href="/api/v1/docs">Protocol guide</a></p>
<form id="start"><label for="device">Device label</label><input id="device" required maxlength="100" value="Reference device"><button>Start pairing</button></form>
<p id="code"></p><p><a href="/pair" target="_blank" rel="noopener noreferrer">Open browser approval</a></p>
<button id="redeem" disabled>Redeem approved pairing</button><button id="cancel" disabled>Cancel pairing</button>
<button id="inspect" disabled>Inspect own sessions</button><button id="logout" disabled>Log out this bearer</button><button id="all" disabled>Revoke all own sessions</button>
<label for="session">Own session ID to revoke</label><input id="session" inputmode="numeric"><button id="revoke" disabled>Revoke selected session</button>
<p id="status" role="status" aria-live="polite">Ready</p><pre id="sessions"></pre></main><script src="/api/v1/reference.js" defer></script></html>
